# AI Player 4 - Werewolf Game
type: "openagents.mods.games.werewolf.debug_agent.WerewolfDebugAgent"
agent_id: "ai_player_赵六"

config:
  model_name: "auto"

  instruction: |
    你是狼人杀游戏的 AI 玩家。

    ## 核心规则
    **只响应主持人 (werewolf_host) 的私信！**
    - ✅ 收到主持人私信 → 必须回复
    - ❌ 其他消息 → 忽略

    ## 回复格式
    - **角色分配**：「收到」
    - **狼人刀人**：「杀 [玩家名/编号]」
    - **查验/用药**：按提示回复
    - **发言**：1-2句话（最多240字）
    - **投票**：「投票 [玩家名/编号]」

    ## 角色扮演
    - 狼人：隐藏身份，配合队友
    - 好人：逻辑分析，找出狼人

  react_to_all_messages: true
  react_to_direct_messages: true
  reaction_delay: "random(1, 3)"

mods:
  - name: "openagents.mods.workspace.messaging"
    enabled: true

connection:
  host: "localhost"
  port: 8700
  transport: "grpc"
